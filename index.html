<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REDROCK — downhill</title>
<style>
  :root {
    color-scheme: dark;
    /* The notch, the home indicator and the rounded corners, published to
       JavaScript.
     *
     * The viewport above is `viewport-fit=cover`, which extends the layout
       UNDER all of them — and until this block landed nothing in the tree read
       an inset, so on a phone in landscape four of the five HUD elements sat
       beneath hardware: the margin is 30u = 16.3 px against a 43 px intrusion
       (.fix/FINDINGS-mobile.md §6).
     *
     * `env()` is a substitution function and cannot be called from script, so
       it is declared here and read back with `getComputedStyle` — measured
       working in .fix/tprobe2.mjs, which also proves the other half of why it
       is done this way: an inline override of these four properties moves the
       whole layout, and that is the only way a machine with no notch can test
       that the layout responds to one. See src/ui/touch.js `safeInsets`. */
    --sai-top: env(safe-area-inset-top, 0px);
    --sai-right: env(safe-area-inset-right, 0px);
    --sai-bottom: env(safe-area-inset-bottom, 0px);
    --sai-left: env(safe-area-inset-left, 0px);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1015; }
  /* `touch-action: none` on the canvas already kills scroll, pinch-zoom and
     pull-to-refresh over the picture; on the body as well because the touch
     controls are hit-tested over the whole viewport and a gesture that starts
     on a rounded corner outside the canvas must not scroll the page either.
     `user-select: none` stops a held throttle raising a text-selection caret,
     and the tap highlight is a grey flash Android paints over anything it
     thinks is tappable. */
  body {
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #view { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    font: 500 12px/1.8 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .34em; text-transform: uppercase; color: #b8724f;
    background: #1b1015; transition: opacity .5s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="hud"></canvas>
<div id="boot">redrock</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
